<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruleta Instituto San Isidro</title>
    <!-- Fuente moderna Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --accent: #f59e0b;
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --success: #10b981;
            --success-hover: #059669;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1.5rem;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        header h1 {
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #38bdf8, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-top: 0.3rem;
        }

        .main-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
            width: 100%;
            max-width: 1100px;
        }

        @media (min-width: 900px) {
            .main-container {
                grid-template-columns: 360px 1fr;
                align-items: start;
            }
        }

        /* Panel lateral */
        .sidebar {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.5rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
        }

        .sidebar h2 {
            font-size: 1.25rem;
            margin-bottom: 0.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .count-badge {
            font-size: 0.8rem;
            background: var(--primary);
            color: white;
            padding: 0.2rem 0.6rem;
            border-radius: 999px;
            font-weight: 600;
        }

        .sidebar p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 1rem;
        }

        textarea {
            width: 100%;
            height: 350px;
            background: #0b1120;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 0.8rem;
            color: #f1f5f9;
            font-size: 0.95rem;
            line-height: 1.5;
            resize: vertical;
            outline: none;
            transition: border-color 0.2s;
        }

        textarea:focus {
            border-color: #6366f1;
        }

        /* Ruleta y controles */
        .wheel-container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 2rem 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
            position: relative;
        }

        .wheel-wrapper {
            position: relative;
            width: 100%;
            max-width: 460px;
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        canvas#wheelCanvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.6);
        }

        /* Flecha indicadora superior */
        .pointer {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 32px;
            height: 42px;
            z-index: 10;
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.5));
        }

        .pointer svg {
            width: 100%;
            height: 100%;
            fill: #f59e0b;
        }

        /* Centro decorativo de la ruleta */
        .center-pin {
            position: absolute;
            width: 50px;
            height: 50px;
            background: radial-gradient(circle, #f8fafc 0%, #cbd5e1 50%, #64748b 100%);
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(0,0,0,0.6), inset 0 2px 4px rgba(255,255,255,0.8);
            border: 3px solid #334155;
            z-index: 5;
            pointer-events: none;
        }

        /* Botón de Girar */
        .spin-btn {
            margin-top: 1.8rem;
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            color: #ffffff;
            font-size: 1.3rem;
            font-weight: 700;
            padding: 0.9rem 3.5rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(79, 70, 229, 0.4);
            transition: all 0.2s ease;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .spin-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(79, 70, 229, 0.6);
            background: linear-gradient(135deg, #818cf8, #6366f1);
        }

        .spin-btn:active:not(:disabled) {
            transform: translateY(1px);
        }

        .spin-btn:disabled {
            background: #475569;
            box-shadow: none;
            cursor: not-allowed;
            opacity: 0.6;
        }

        /* Modal de Ganador */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 100;
            padding: 1.5rem;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: #1e293b;
            border: 1px solid #475569;
            border-radius: 20px;
            padding: 2.2rem 2rem;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            transform: scale(0.9);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
        }

        .modal-overlay.active .modal-card {
            transform: scale(1);
        }

        .modal-card .badge {
            display: inline-block;
            background: rgba(245, 158, 11, 0.15);
            color: #fbbf24;
            font-size: 0.85rem;
            font-weight: 700;
            padding: 0.3rem 0.9rem;
            border-radius: 999px;
            margin-bottom: 0.8rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .modal-card h3 {
            font-size: 1.8rem;
            font-weight: 800;
            color: #f8fafc;
            word-break: break-word;
            margin: 0.5rem 0 1.2rem;
            padding: 0.8rem;
            background: #0f172a;
            border-radius: 12px;
            border: 1px solid #334155;
        }

        .modal-card p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 1.8rem;
        }

        .modal-actions {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        @media (min-width: 450px) {
            .modal-actions {
                flex-direction: row;
            }
        }

        .btn-modal {
            flex: 1;
            padding: 0.85rem 1rem;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.1s ease;
        }

        .btn-keep {
            background: #334155;
            color: #f8fafc;
        }

        .btn-keep:hover {
            background: #475569;
        }

        .btn-remove {
            background: var(--danger);
            color: #ffffff;
        }

        .btn-remove:hover {
            background: var(--danger-hover);
        }

        canvas#confettiCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 101;
        }
    </style>
</head>
<body>

    <header>
        <h1>Ruleta Instituto San Isidro</h1>
        <p>Configura las opciones en el panel lateral y presiona girar</p>
    </header>

    <div class="main-container">
        <!-- Panel lateral para ingresar opciones -->
        <aside class="sidebar">
            <h2>
                <span>Opciones</span>
                <span class="count-badge" id="countBadge">0 opciones</span>
            </h2>
            <p>Escribe o pega una opción por línea:</p>
            <textarea id="optionsInput" placeholder="Escribe aquí las opciones..."></textarea>
        </aside>

        <!-- Área principal de la ruleta -->
        <main class="wheel-container">
            <div class="wheel-wrapper">
                <!-- Flecha indicadora superior -->
                <div class="pointer">
                    <svg viewBox="0 0 24 30">
                        <path d="M12 30 L0 0 L24 0 Z"></path>
                    </svg>
                </div>
                
                <!-- Lienzo donde se dibuja la ruleta -->
                <canvas id="wheelCanvas" width="800" height="800"></canvas>
                
                <!-- Centro decorativo -->
                <div class="center-pin"></div>
            </div>

            <button id="spinBtn" class="spin-btn">¡Girar!</button>
        </main>
    </div>

    <!-- Modal del Ganador -->
    <div class="modal-overlay" id="winnerModal">
        <div class="modal-card">
            <span class="badge">¡Opción Ganadora!</span>
            <h3 id="winnerText">---</h3>
            <p>¿Qué deseas hacer con esta opción para los siguientes giros?</p>
            <div class="modal-actions">
                <button class="btn-modal btn-keep" id="btnKeep">Mantener en la ruleta</button>
                <button class="btn-modal btn-remove" id="btnRemove">Eliminar de la ruleta</button>
            </div>
        </div>
    </div>

    <!-- Canvas para efecto de confeti -->
    <canvas id="confettiCanvas"></canvas>

    <script>
        // Paleta de colores atractiva y variada
        const COLORS = [
            '#ef4444', '#f97316', '#f59e0b', '#10b981', 
            '#06b6d4', '#3b82f6', '#6366f1', '#8b5cf6', 
            '#ec4899', '#14b8a6', '#84cc16', '#a855f7'
        ];

        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        const optionsInput = document.getElementById('optionsInput');
        const countBadge = document.getElementById('countBadge');
        const spinBtn = document.getElementById('spinBtn');

        const winnerModal = document.getElementById('winnerModal');
        const winnerText = document.getElementById('winnerText');
        const btnKeep = document.getElementById('btnKeep');
        const btnRemove = document.getElementById('btnRemove');

        let options = [];
        let currentRotation = 0; // en radianes
        let isSpinning = false;
        let lastWinner = null;

        // Extraer opciones activas del textarea
        function getOptionsList() {
            return optionsInput.value
                .split('\n')
                .map(opt => opt.trim())
                .filter(opt => opt.length > 0);
        }

        // Actualizar datos y redibujar
        function updateWheel() {
            options = getOptionsList();
            countBadge.textContent = `${options.length} ${options.length === 1 ? 'opción' : 'opciones'}`;
            spinBtn.disabled = options.length < 2 || isSpinning;
            drawWheel();
        }

        // Dibujar la ruleta en el Canvas
        function drawWheel() {
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = centerX - 15;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (options.length === 0) {
                // Estado vacío
                ctx.beginPath();
                ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
                ctx.fillStyle = '#1e293b';
                ctx.fill();
                ctx.lineWidth = 6;
                ctx.strokeStyle = '#334155';
                ctx.stroke();

                ctx.fillStyle = '#64748b';
                ctx.font = 'bold 28px Poppins';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('Sin opciones disponibles', centerX, centerY);
                return;
            }

            const arcSize = (2 * Math.PI) / options.length;

            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.rotate(currentRotation);

            for (let i = 0; i < options.length; i++) {
                const startAngle = i * arcSize;
                const endAngle = startAngle + arcSize;

                // Sector
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.arc(0, 0, radius, startAngle, endAngle);
                ctx.fillStyle = COLORS[i % COLORS.length];
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#0f172a';
                ctx.stroke();

                // Texto de la opción
                ctx.save();
                ctx.rotate(startAngle + arcSize / 2);
                ctx.textAlign = 'right';
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 22px Poppins';
                ctx.shadowColor = 'rgba(0, 0, 0, 0.6)';
                ctx.shadowBlur = 4;

                let label = options[i];
                if (label.length > 18) {
                    label = label.substring(0, 16) + '...';
                }

                ctx.fillText(label, radius - 35, 8);
                ctx.restore();
            }

            ctx.restore();

            // Borde exterior decorativo
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
            ctx.lineWidth = 8;
            ctx.strokeStyle = '#334155';
            ctx.stroke();
        }

        // Curva de desaceleración suave (Cubic Ease-Out)
        function easeOutCubic(t) {
            return 1 - Math.pow(1 - t, 3);
        }

        // Lógica de Giro
        function spin() {
            if (isSpinning || options.length < 2) return;

            isSpinning = true;
            spinBtn.disabled = true;

            const duration = 5000; // 5 segundos
            const startAngle = currentRotation;
            // Da entre 6 y 9 vueltas completas + ángulo aleatorio extra
            const fullRotations = (6 + Math.random() * 3) * 2 * Math.PI;
            const extraAngle = Math.random() * 2 * Math.PI;
            const totalRotationChange = fullRotations + extraAngle;

            const startTime = performance.now();

            function animate(now) {
                const elapsed = now - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const easedProgress = easeOutCubic(progress);

                currentRotation = startAngle + totalRotationChange * easedProgress;
                drawWheel();

                if (progress < 1) {
                    requestAnimationFrame(animate);
                } else {
                    isSpinning = false;
                    determineWinner();
                }
            }

            requestAnimationFrame(animate);
        }

        // Determinar ganador (apuntador arriba a las 12 en punto / 270 grados)
        function determineWinner() {
            const arcSize = (2 * Math.PI) / options.length;
            const normalizedAngle = (currentRotation % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI);

            // 1.5 * PI equivale a las 12 en punto (arriba)
            let pointerAngle = (1.5 * Math.PI - normalizedAngle) % (2 * Math.PI);
            if (pointerAngle < 0) pointerAngle += 2 * Math.PI;

            const winnerIndex = Math.floor(pointerAngle / arcSize);
            lastWinner = options[winnerIndex];

            // Mostrar modal
            winnerText.textContent = lastWinner;
            winnerModal.classList.add('active');
            fireConfetti();
        }

        // Acciones del modal
        btnKeep.addEventListener('click', () => {
            winnerModal.classList.remove('active');
            spinBtn.disabled = false;
        });

        btnRemove.addEventListener('click', () => {
            if (lastWinner !== null) {
                // Elimina la primera coincidencia del ganador en el textarea
                const lines = optionsInput.value.split('\n');
                const idx = lines.findIndex(line => line.trim() === lastWinner);
                if (idx !== -1) {
                    lines.splice(idx, 1);
                    optionsInput.value = lines.join('\n');
                    updateWheel();
                }
            }
            winnerModal.classList.remove('active');
            spinBtn.disabled = options.length < 2;
        });

        // Eventos
        optionsInput.addEventListener('input', updateWheel);
        spinBtn.addEventListener('click', spin);

        // Inicializar
        updateWheel();

        // --- Efecto de Confeti Liviano en Canvas ---
        const confettiCanvas = document.getElementById('confettiCanvas');
        const cCtx = confettiCanvas.getContext('2d');
        let particles = [];

        function resizeConfetti() {
            confettiCanvas.width = window.innerWidth;
            confettiCanvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeConfetti);
        resizeConfetti();

        function fireConfetti() {
            particles = [];
            for (let i = 0; i < 90; i++) {
                particles.push({
                    x: window.innerWidth / 2,
                    y: window.innerHeight / 2,
                    w: Math.random() * 8 + 4,
                    h: Math.random() * 8 + 4,
                    color: COLORS[Math.floor(Math.random() * COLORS.length)],
                    vx: (Math.random() - 0.5) * 16,
                    vy: (Math.random() - 0.7) * 18,
                    gravity: 0.35,
                    rotation: Math.random() * 360,
                    rotationSpeed: (Math.random() - 0.5) * 10
                });
            }
            requestAnimationFrame(renderConfetti);
        }

        function renderConfetti() {
            cCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
            let active = false;

            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += p.gravity;
                p.rotation += p.rotationSpeed;

                if (p.y < confettiCanvas.height) {
                    active = true;
                    cCtx.save();
                    cCtx.translate(p.x, p.y);
                    cCtx.rotate((p.rotation * Math.PI) / 180);
                    cCtx.fillStyle = p.color;
                    cCtx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
                    cCtx.restore();
                }
            });

            if (active) {
                requestAnimationFrame(renderConfetti);
            } else {
                cCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
            }
        }
    </script>
</body>
</html>
